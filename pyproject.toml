[project]
name = "latex-viitteiden-hallinta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = []
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.2.4",
    "robotframework>=7.3.2",
    "robotframework-browser>=20.5.0",
    "robotframework-browser-batteries>=20.5.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pylint>=4.0.4",
    "pytest>=9.2.0",
]

[tool.pylint.main]
jobs = 0
ignore = ["unit_tests"]

[tool.pylint.messages_control]
disable = [
    "broad-exception-caught",
    "cyclic-import",
    "duplicate-code",
    "import-error",
    "invalid-name",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "redefined-builtin",
    "too-many-arguments",
    "too-many-branches",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
    "wrong-import-order",
    "wrong-import-position",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.basic]
good-names = ["app", "db", "id"]
